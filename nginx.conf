# ============================================
# Nginx reverse proxy config for HnH-TV
# HTTPS with Let's Encrypt SSL
# ============================================

upstream backend {
    server backend:5000;
}

upstream ai {
    server ai:8000;
}

# --- HTTP: redirect everything to HTTPS (except ACME challenges) ---
server {
    listen 80;
    server_name hnh-tv.duckdns.org;

    # Let's Encrypt certificate verification
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS: main server block ---
server {
    listen 443 ssl;
    server_name hnh-tv.duckdns.org;

    # SSL certificates (managed by Certbot)
    ssl_certificate     /etc/letsencrypt/live/hnh-tv.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hnh-tv.duckdns.org/privkey.pem;

    # Modern SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # HSTS — tell browsers to always use HTTPS
    add_header Strict-Transport-Security "max-age=63072000" always;

    # Max upload size
    client_max_body_size 50M;

    # Main app — Express serves both API + React build
    location / {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Video streaming — disable buffering, long timeouts
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # AI Chatbot — proxied to FastAPI
    location /ai/ {
        rewrite ^/ai/(.*) /$1 break;
        proxy_pass http://ai;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
